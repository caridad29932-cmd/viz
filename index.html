<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viz — First Local Video Editor</title>
  <meta name="description" content="Viz: the first local video editor for free. No server, no backend, no data leaves your machine. Edit videos, images, text, and audio entirely in your browser." />
  <meta name="theme-color" content="#07070d" />

  <!-- COI SERVICE WORKER -->
  <script>window.VIZ_BASE_PATH = '/Viz/';</script>
  <script src="coi-serviceworker.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="app-logo">
        <div class="app-logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        </div>
        <span class="app-logo-text">VIZ</span>
        <span class="app-logo-badge">LOCAL · FREE · PRIVATE</span>
      </div>
      <div class="header-center">
        <span class="header-filename" id="header-filename">Multi-Track Project</span>
        <span class="header-dot active" id="header-dot"></span>
        <span class="header-status" id="header-status">Ready</span>
      </div>
      <div class="header-right">
        <button class="tool-btn" id="btn-new-project" type="button" title="New Project">New</button>
        <button class="tool-btn" id="btn-save-project" type="button" title="Save Project">Save</button>
        <button class="tool-btn" id="btn-load-project" type="button" title="Load Project">Load</button>
        <input type="file" id="load-project-input" accept=".json,application/json" style="display:none" aria-hidden="true" tabindex="-1" />
        <button class="tool-btn" id="btn-undo" type="button" title="Undo (Ctrl+Z)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          Undo
        </button>
        <button class="tool-btn" id="btn-redo" title="Redo (Ctrl+Y)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Redo
        </button>
      </div>
    </header>

    <!-- Main NLE Workspace -->
    <main class="editor-layout">
      <div class="editor-view">

        <!-- Left: Media Library & Canvas Preview -->
        <div class="editor-main">

          <!-- Add Media Bar -->
          <div class="media-add-bar">
            <span class="media-bar-title">ADD MEDIA & LAYERS</span>
            <div class="media-bar-buttons">
              <button class="add-media-btn" id="add-video-btn" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                + Video
              </button>
              <button class="add-media-btn" id="add-image-btn" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                + Picture
              </button>
              <button class="add-media-btn" id="add-text-btn" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                + Text
              </button>
              <button class="add-media-btn" id="add-audio-btn" type="button">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                + Audio
              </button>
            </div>
          </div>

          <!-- Canvas Preview Panel -->
          <section class="preview-panel">
            <div class="panel-header">
              <div class="panel-header-left">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/></svg>
                <span>COMPOSITE PREVIEW (SELECTABLE OBJECTS & HANDLES)</span>
              </div>
              <div class="panel-header-right">
                <select class="aspect-ratio-select" id="preview-ratio-select" title="Aspect Ratio Preset">
                  <option value="16:9">16:9 Landscape</option>
                  <option value="9:16">9:16 Portrait</option>
                  <option value="1:1">1:1 Square</option>
                  <option value="4:5">4:5 Vertical</option>
                  <option value="4:3">4:3 Classic</option>
                  <option value="21:9">21:9 Ultrawide</option>
                  <option value="custom">Custom</option>
                </select>
                <span class="preview-badge" id="preview-badge">1920×1080</span>
                <span class="preview-time-display" id="preview-time">00:00.00 / 00:00.00</span>
              </div>
            </div>

            <div class="video-wrapper">
              <canvas id="preview-canvas" class="preview-canvas"></canvas>
            </div>

            <!-- Transport Bar -->
            <div class="transport-bar">
              <div class="transport-left">
                <button class="transport-btn play-btn" id="ctrl-play" type="button" title="Play/Pause (Space)" aria-label="Play or pause preview">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" id="ctrl-play-icon" role="img" aria-label="Play icon"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </button>
                <button class="transport-btn" id="ctrl-stop" type="button" title="Stop & Reset" aria-label="Stop preview">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
                </button>
              </div>

              <div class="transport-center">
                <span class="transport-time" id="ctrl-time">00:00.00</span>
              </div>

              <div class="transport-right">
                <div class="zoom-controls">
                  <button class="mini-btn" id="zoom-out" title="Zoom timeline out">-</button>
                  <span class="zoom-level" id="zoom-level">100%</span>
                  <button class="mini-btn" id="zoom-in" title="Zoom timeline in">+</button>
                </div>
              </div>
            </div>
          </section>

          <!-- Multi-Track Timeline Panel -->
          <section class="timeline-panel" id="multitimeline-container"></section>
        </div>

        <!-- Right Sidebar: Properties & Export -->
        <div class="editor-sidebar-resizer" id="sidebar-resizer" title="Drag to resize panel"></div>
        <aside class="editor-sidebar">
          <!-- Selection Actions Panel -->
          <section class="sidebar-panel">
            <div class="panel-header compact">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
              <span>EDIT TOOLS</span>
            </div>
            <div class="tools-grid" style="padding: 8px;">
              <div class="tool-row">
                <button class="tool-btn" id="btn-copy" type="button" title="Copy Selected (Ctrl+C)">Copy</button>
                <button class="tool-btn" id="btn-paste" type="button" title="Paste (Ctrl+V)">Paste</button>
              </div>
              <div class="tool-row" style="margin-top: 4px;">
                <button class="tool-btn" id="btn-duplicate" type="button" title="Duplicate (Ctrl+D)">Duplicate</button>
                <button class="tool-btn danger" id="btn-delete" type="button" title="Delete Element (Del)">Delete</button>
              </div>
            </div>
          </section>

          <!-- Properties Panel -->
          <section class="sidebar-panel" id="properties-panel-container"></section>

          <!-- Export Panel -->
          <section class="sidebar-panel export-panel">
            <div class="panel-header compact">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span>EXPORT COMPOSITION</span>
            </div>
            <div class="export-options">
              <button class="export-btn" id="btn-export" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export Video File
              </button>
            </div>
          </section>
        </aside>

      </div>
    </main>
  </div>

  <!-- Progress Overlay -->
  <div id="progress-overlay" class="progress-overlay">
    <div class="progress-card">
      <div class="progress-spinner" id="progress-spinner">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="24" stroke="rgba(139,92,246,0.15)" stroke-width="4" fill="none"/>
          <circle cx="28" cy="28" r="24" stroke="url(#prog-grad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="120 151" class="progress-ring"/>
          <defs><linearGradient id="prog-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient></defs>
        </svg>
      </div>
      <h2 class="progress-title" id="progress-title">Exporting Video...</h2>
      <p class="progress-subtitle" id="progress-subtitle">Rendering multi-track composition</p>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar" style="width: 0%"></div>
      </div>
      <span class="progress-percent" id="progress-percent">0%</span>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
