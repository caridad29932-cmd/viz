name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /viz/
      - name: Verify dist/index.html is built
        run: |
          echo "--- dist/index.html first 20 lines ---"
          head -n 20 dist/index.html
          if grep -q 'src="./src/main.js"' dist/index.html; then
            echo "ERROR: dist/index.html still contains raw source path ./src/main.js"
            exit 1
          fi
          if [ ! -f dist/assets/index-*.js ]; then
            echo "ERROR: no bundled JS found in dist/assets/"
            exit 1
          fi
          echo "dist/ looks correctly built."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
